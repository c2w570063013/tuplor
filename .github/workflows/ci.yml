# Typecheck + build on every pull request and push to main. No packaging or signing.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest # no packaging here, so no macOS runner needed
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Check LICENSE
        run: npm run license -- --check
      - name: Syntax-check desktop scripts
        run: for f in desktop/src/*.cjs desktop/scripts/*.mjs scripts/*.mjs; do node --check "$f"; done
