# Builds the product website in site/ and deploys it to GitHub Pages.
#
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# Base path is detected automatically by actions/configure-pages:
#   - project page  https://OWNER.github.io/REPO/  → BASE_PATH=/REPO/
#   - custom domain https://example.com/            → BASE_PATH=/
# To switch to a custom domain: set it in Settings → Pages, add site/public/CNAME
# containing the domain, and update `siteUrl` / `basePath` in site/src/config.ts
# (used for local builds). No change to this workflow is needed.
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
