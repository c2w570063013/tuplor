<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tuplor</title>
    <script>
      // One-time copy of settings saved under the app's former name (pgstudio.*).
      try {
        if (!localStorage.getItem('tuplor.migrated')) {
          for (const k of Object.keys(localStorage)) {
            if (k.startsWith('pgstudio.')) { const n = 'tuplor.' + k.slice(9); if (localStorage.getItem(n) == null) localStorage.setItem(n, localStorage.getItem(k)); }
          }
          localStorage.setItem('tuplor.migrated', '1');
        }
      } catch {}
      try { const t = localStorage.getItem('tuplor.theme'); if (t === 'light') document.documentElement.classList.remove('dark'); } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
